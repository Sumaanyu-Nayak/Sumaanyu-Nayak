name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Sumaanyu-Nayak
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publish
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git clone --depth 1 --branch output \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Sumaanyu-Nayak/Sumaanyu-Nayak.git output-repo || \
          git clone --depth 1 \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Sumaanyu-Nayak/Sumaanyu-Nayak.git output-repo

          rm -rf output-repo/*
          cp -r dist/* output-repo/

          cd output-repo
          git add .
          git commit -m "Update contribution snake" || true
          git push origin HEAD:output --force
